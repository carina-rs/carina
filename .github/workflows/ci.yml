name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          # On push events (e.g. main branch push), always run.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          if echo "$changed" | grep -qE '^(.*\.rs$|.*Cargo\.toml$|Cargo\.lock$|\.cargo/.*|\.config/.*|scripts/.*|\.github/(workflows|actions)/.*)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
      - run: cargo check --all-targets --all-features

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
      - run: cargo clippy --all-targets --all-features -- -D warnings

  provider-boundaries:
    name: Provider Boundary Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-provider-boundaries.sh

  error-source-display:
    name: Error Source Display Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-error-source-not-in-display.sh
      - run: bash scripts/test-check-error-source-not-in-display.sh

  docs-spellings:
    name: Docs Spelling Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-check-docs-spellings.sh
      - run: bash scripts/check-docs-use-new-spellings.sh

  check-resources-access:
    name: Check Direct parsed.resources Access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-direct-resources-access.sh

  check-cli-hints:
    name: Check CLI Project Hint Rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-cli-hints-use-project-command.sh

  check-no-home-env-reads:
    name: Check Home Environment Reads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-home-env-reads.sh

  check-crates-not-publishable:
    name: Check Crates Not Publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-crates-not-publishable.sh

  check-plan-fixtures:
    name: Check Plan Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-plan-fixtures.sh

  check-rust-cache-via-local-action:
    name: Check Rust Cache Usage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-rust-cache-via-local-action.sh

  check-examples:
    name: Check Example Files
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
      - run: echo "Provider examples moved to standalone repos"

  validate-crn:
    name: Validate .crn Files
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
      - run: bash scripts/validate-crn-files.sh

  check-example-warnings:
    name: Check Example Warnings
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
      - run: bash scripts/check-example-warnings.sh

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: ./.github/actions/rust-cache
      - uses: taiki-e/install-action@nextest
      # Build the WASM fixture so carina-plugin-host's integration tests run
      # instead of silently skipping. Without this step a stale or missing
      # fixture leaves the wasm_integration_test suite as a no-op in CI.
      - run: >-
          cargo build
          -p carina-provider-mock
          -p carina-provider-mock-http
          --target wasm32-wasip2
      - run: cargo nextest run --workspace --all-features
      # nextest does not run doctests; cover them with cargo test --doc.
      - run: cargo test --workspace --doc --all-features

  binary-build:
    name: Binary Build (linux-x86_64)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Use a baseline Debian userland for linux x86_64; see #3963.
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: binary-bookworm
      - run: cargo build --release --bin carina
      - name: Verify x86-64 baseline compatibility and version stamp
        shell: bash
        run: |
          apt-get update
          apt-get install -y qemu-user
          qemu-x86_64 -cpu qemu64 target/release/carina --version | grep -E '\([0-9a-f]{7,} '
      - uses: actions/upload-artifact@v4
        with:
          name: carina-linux-x86_64
          path: target/release/carina
          retention-days: 30
