name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: 0.9.151
  # Keep debug data out of CI test archives. Main's cache warmer and every
  # cache consumer must inherit the same profile overrides (and cache hash).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      version_only: ${{ steps.filter.outputs.version_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The merge queue always runs the full suite, including releases.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "version_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(bash scripts/classify-ci-diff.sh "$BASE_SHA" "$HEAD_SHA")" = "version-only" ]; then
            echo "version_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_only=false" >> "$GITHUB_OUTPUT"
          fi
          if ! changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qE '^(.*\.rs$|.*Cargo\.toml$|Cargo\.lock$|\.cargo/.*|\.config/.*|scripts/.*|site/src/content/providers/writing/(schemas|getting-started)\.md$|\.github/(workflows|actions)/.*)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check
    needs: changes
    # Push builds refresh this job's main-branch cache for PR/queue restores.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
      - run: cargo check --all-targets --all-features

  feature-isolation:
    name: Feature Isolation
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --workspace --each-feature --no-dev-deps

  fmt:
    name: Format
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
      - run: cargo clippy --all-targets --all-features -- -D warnings

  provider-boundaries:
    name: Provider Boundary Check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-provider-boundaries.sh
      - run: bash scripts/check-wit-guest-text-confinement.sh

  error-source-display:
    name: Error Source Display Check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-error-source-not-in-display.sh
      - run: bash scripts/test-check-error-source-not-in-display.sh

  no-wall-clock-test-assertions:
    name: Check Wall Clock Test Assertions
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-check-no-wall-clock-test-assertions.sh
      - run: bash scripts/check-no-wall-clock-test-assertions.sh

  docs-spellings:
    name: Docs Spelling Check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-check-docs-spellings.sh
      - run: bash scripts/check-docs-use-new-spellings.sh

  check-resources-access:
    name: Check Direct parsed.resources Access
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-direct-resources-access.sh

  check-cli-hints:
    name: Check CLI Project Hint Rendering
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-cli-hints-use-project-command.sh

  check-no-home-env-reads:
    name: Check Home Environment Reads
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-home-env-reads.sh

  check-crates-not-publishable:
    name: Check Crates Not Publishable
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-crates-not-publishable.sh

  check-wit-bindgen-workspace:
    name: Check wit-bindgen Workspace Dependency
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/check-wit-bindgen-workspace.sh
      - run: bash scripts/check-provider-sdk-bindings.sh
      - run: bash scripts/test-check-provider-sdk-bindings.sh
      - run: bash scripts/check-test-utils-dev-only.sh
      - run: bash scripts/test-check-test-utils-dev-only.sh

  check-plan-fixtures:
    name: Check Plan Fixtures
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-plan-fixtures.sh

  check-rust-cache-via-local-action:
    name: Check Rust Cache Usage
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-rust-cache-via-local-action.sh
      - run: bash scripts/test-classify-ci-diff.sh
      - run: bash scripts/test-rust-cache-key.sh

  check-vendored-patches-used:
    name: Check Vendored Patches Used
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/check-vendored-patches-used.sh

  check-examples:
    name: Check Example Files
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
      - run: echo "Provider examples moved to standalone repos"

  validate-crn:
    name: Validate .crn Files
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
      - run: bash scripts/validate-crn-files.sh

  check-example-warnings:
    name: Check Example Warnings
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
      - run: bash scripts/check-example-warnings.sh

  test:
    # Keep the main cache writer's job id and existing cache key. Auxiliary
    # checks restore this namespace; push still only builds, without testing.
    name: Build Test Archive
    needs: changes
    outputs:
      toolchain: ${{ steps.toolchain.outputs.version }}
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - id: toolchain
        run: rustc --version | awk '{print "version=" $2}' >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/rust-cache
      - uses: ./.github/actions/setup-nextest
        timeout-minutes: 3
        with:
          version: ${{ env.NEXTEST_VERSION }}
      - run: >-
          cargo build
          -p carina-provider-mock
          -p carina-provider-mock-http
          --target wasm32-wasip2
      - name: Compile workspace tests for the main cache
        if: github.event_name == 'push'
        run: cargo nextest run --workspace --all-features --no-run
      - name: Archive workspace tests
        if: github.event_name != 'push'
        # Level 1 favors packing speed without the large ratio loss of fast
        # negative levels; the artifact is already compressed before upload.
        run: cargo nextest archive --workspace --all-features --archive-file nextest-archive.tar.zst --zstd-level 1
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: wasm-fixtures
          path: target/wasm32-wasip2/debug/*.wasm
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  test-partition:
    name: Workspace tests (${{ matrix.partition }}/6)
    needs: [changes, test]
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the measured test-execution tail near four minutes. Shrinking
        # the archive reduces transfer costs for these six jobs and isolation.
        partition: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.test.outputs.toolchain }}
      - uses: ./.github/actions/setup-nextest
        timeout-minutes: 3
        with:
          version: ${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - uses: actions/download-artifact@v4
        with:
          name: wasm-fixtures
          path: target/wasm32-wasip2/debug
      - run: bash scripts/require-wasm-fixtures.sh
      # Each fresh runner unpacks once. Overwrite permits target/ created by
      # the fixture download. The checkout location preserves Cargo's
      # compile-time binary paths; a temporary extraction would break them.
      - run: >-
          cargo nextest run --archive-file nextest-archive.tar.zst
          --workspace-remap . --extract-to . --extract-overwrite
          --partition count:${{ matrix.partition }}/6 --no-fail-fast

  test-isolation:
    name: In-process isolation
    needs: [changes, test]
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.test.outputs.toolchain }}
      - uses: ./.github/actions/setup-nextest
        timeout-minutes: 3
        with:
          version: ${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - uses: actions/download-artifact@v4
        with:
          name: wasm-fixtures
          path: target/wasm32-wasip2/debug
      - run: bash scripts/require-wasm-fixtures.sh
      - run: scripts/test-in-process-isolation.sh nextest-archive.tar.zst

  test-provider-cause:
    name: Provider cause API
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: ./.github/actions/rust-cache
        with:
          cache-job: test
      # The downstream compile-fail script is deliberately offline. Populate
      # every workspace registry dependency independently of cache contents.
      - run: cargo fetch --locked
      - run: bash scripts/check-provider-cause-test-api.sh

  test-doctests:
    name: Doctests
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          cache-job: test
      # nextest archives do not contain doctests.
      - run: cargo test --workspace --doc --all-features

  test-result:
    name: Test
    needs: [changes, test, test-partition, test-isolation, test-provider-cause, test-doctests]
    # Preserve the required check's legitimate docs/version-only skip. An
    # unsuccessful change detector must instead run this job and fail closed.
    if: always() && github.event_name != 'push' && (needs.changes.result != 'success' || (needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.version_only != 'true')))
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to succeed
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys
          results = json.loads(os.environ["NEEDS_RESULTS"])
          failed = {job: value["result"] for job, value in results.items() if value["result"] != "success"}
          if failed:
              sys.exit(f"Test dependencies did not succeed: {failed}")
          print("Every test partition and auxiliary check succeeded.")
          PYTHON

  binary-build:
    name: Binary Build (linux-x86_64)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Use a baseline Debian userland for linux x86_64; see #3963.
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: binary-bookworm
      - run: cargo build --release --bin carina
      - name: Verify x86-64 baseline compatibility and version stamp
        shell: bash
        run: |
          apt-get update
          apt-get install -y qemu-user
          qemu-x86_64 -cpu qemu64 target/release/carina --version | grep -E '\([0-9a-f]{7,} '
      - uses: actions/upload-artifact@v4
        with:
          name: carina-linux-x86_64
          path: target/release/carina
          retention-days: 30
