name: Rust cache
description: Restore and save the Rust build cache with all build-affecting workspace settings

inputs:
  shared-key:
    description: Optional shared cache key passed through to Swatinem/rust-cache
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: manifest
      shell: bash
      run: |
        key=$(bash scripts/rust-cache-key.sh)
        echo "key=$key" >> "$GITHUB_OUTPUT"
    # rust-cache's shared-key replaces key, so include the normalized root
    # Cargo.toml hash in whichever one applies. Only [workspace.package]'s
    # version is normalized: release bumps reuse the restore prefix, while
    # dependency, profile, patch, and all other manifest edits invalidate it.
    # Merge queue refs are single-use, so caches saved there are never restored
    # and only evict main's. Queue runs still restore from main.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.event_name != 'merge_group' }}
        key: ${{ inputs.shared-key == '' && steps.manifest.outputs.key || '' }}
        shared-key: ${{ inputs.shared-key != '' && format('{0}-{1}', inputs.shared-key, steps.manifest.outputs.key) || '' }}
