[package]
name = "carina-plugin-host"
version = "0.9.0"
edition = "2024"
publish.workspace = true
license = "MIT"

[lib]
doctest = false

[features]
test-utils = []

[dependencies]
carina-core = { path = "../carina-core" }
carina-provider-protocol = { path = "../carina-provider-protocol" }
carina-provider-resolver = { path = "../carina-provider-resolver" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
wasmtime = { version = "43", features = ["call-hook", "component-model"] }
wasmtime-wasi = "43"
wasmtime-wasi-http = "43"
hyper = "1"
tokio = { version = "1", features = ["rt", "time"] }
# Used by the local phase-instrumented copy of `default_send_request_handler`.
# Versions track wasmtime-wasi-http 43.x so we share the rustls/hyper stack
# instead of forking the TLS/HTTP wire path.
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = "0.22"
tokio-rustls = "0.25"
webpki-roots = "0.26"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
indexmap = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
argon2 = "0.5"
carina-core = { path = "../carina-core", features = ["test-utils"] }
carina-plugin-host = { path = ".", features = ["test-utils"] }
carina-provider-resolver = { path = "../carina-provider-resolver", features = ["test-utils"] }
carina-plugin-sdk = { path = "../carina-plugin-sdk" }
carina-state = { path = "../carina-state" }
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
wasmprinter = "0.245.1"
wasm-encoder = "0.245.1"
wat = "1"
wit-component = { version = "0.245.1", features = ["dummy-module"] }
wit-parser = "0.245.1"
