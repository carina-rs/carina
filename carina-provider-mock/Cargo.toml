[package]
name = "carina-provider-mock"
version.workspace = true
publish.workspace = true
edition = "2024"
license = "MIT"

[lints]
workspace = true

[lib]
doctest = false

[[bin]]
name = "carina-provider-mock"
path = "src/main.rs"

[[bin]]
name = "carina-provider-mock-raw-float"
path = "src/bin/raw_float.rs"

[[bin]]
name = "carina-provider-mock-constructor-panic"
path = "src/bin/constructor_panic.rs"

[dependencies]
carina-core = { path = "../carina-core" }
carina-plugin-sdk = { path = "../carina-plugin-sdk", features = ["aws"] }
carina-provider-protocol = { path = "../carina-provider-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
carina-core = { path = "../carina-core", features = ["test-utils", "provider-host"] }
carina-state = { path = "../carina-state" }
tempfile = "3"
