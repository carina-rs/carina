[package]
name = "carina-provider-mock-http"
version.workspace = true
publish.workspace = true
edition = "2024"
license = "MIT"

[[bin]]
name = "carina-provider-mock-http"
path = "src/main.rs"

[[bin]]
name = "carina-provider-mock-http-aws"
path = "src/aws.rs"

[[bin]]
name = "carina-provider-mock-http-aws-unused"
path = "src/aws_unused.rs"

[dependencies]
carina-plugin-sdk = { path = "../carina-plugin-sdk" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x", "test-util"] }
futures = "0.3"
serde_json = "1"
wasi = "0.14"
wit-bindgen = { workspace = true }
