version = 5

[registry_host."registry.carina-rs.dev"]
discovery_pin_present = false

[[provider]]
name = "aws"
source = "carina-rs/aws"
mode = "version"
version = "0.5.0"
sha256 = "pinned-checksum"

[provider.registry]
resolved_hostname = "registry.carina-rs.dev"
