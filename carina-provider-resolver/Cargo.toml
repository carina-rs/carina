[package]
name = "carina-provider-resolver"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
carina-core = { path = "../carina-core" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
ureq = "3"
flate2 = "1"
tar = "0.4"
semver = "1"
serde_json = "1"
zip = "2"
dirs = "6"
time = { version = "0.3", features = ["formatting", "parsing"] }
sigstore = { version = "0.14", default-features = false, features = ["verify", "rustls-tls"] }
sigstore_protobuf_specs = "0.5.1"
p256 = "0.13"
base64 = "0.22"

[dev-dependencies]
indexmap = "2"
tempfile = "3"
