[package]
name = "carina-provider-resolver"
version.workspace = true
publish.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = true

[features]
test-utils = []

[dependencies]
carina-core = { path = "../carina-core" }
carina-sigstore-tlog = { path = "../carina-sigstore-tlog" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
ureq = "3"
url = "2"
futures = "0.3"
semver = { version = "1", features = ["serde"] }
serde_json = "1"
zip = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
sigstore = { version = "0.14", default-features = false, features = ["verify", "rustls-tls"] }
sigstore_protobuf_specs = "0.5.1"
x509-cert = "0.2"
base64 = "0.22"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
indexmap = "2"
rcgen = "0.13.2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
