[package]
name = "carina-credentials-aws"
version.workspace = true
publish.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
aws-config = "1"
aws-credential-types = "1"
carina-plugin-host = { path = "../carina-plugin-host" }
log = "0.4"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
sha1 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
