<svg class="rf-flow" width="780" height="488" viewBox="0 0 780 488" role="img" aria-labelledby="rf-flow-title rf-flow-desc" xmlns="http://www.w3.org/2000/svg"><title id="rf-flow-title">Registry API call flow</title><desc id="rf-flow-desc">The client fetches /.well-known/carina.json, the version list and the download endpoint from the registry, then downloads the WASM binary from download_url on GitHub Releases.</desc><style>.rf-flow{}.rf-flow .life{stroke:#334155;stroke-width:1.5;stroke-dasharray:4 4}.rf-flow .box{fill:#1e293b;stroke:#334155}.rf-flow .actor{fill:#f1f5f9;font:600 14px Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;text-anchor:middle}.rf-flow .req{stroke:#06b6d4;stroke-width:1.5}.rf-flow .res{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 4}.rf-flow .lbl{fill:#e2e8f0;font:12px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.rf-flow .head-req{fill:#06b6d4}.rf-flow .head-res{fill:#94a3b8}</style><defs><marker id="rf-a-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-req" d="M0 0L10 5L0 10z"/></marker><marker id="rf-a-res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-res" d="M0 0L10 5L0 10z"/></marker></defs><line class="life" x1="70" y1="44" x2="70" y2="480"/><rect class="box" x="20" y="12" width="100" height="32" rx="6"/><text class="actor" x="70" y="33">Client</text><line class="life" x1="440" y1="44" x2="440" y2="480"/><rect class="box" x="390" y="12" width="100" height="32" rx="6"/><text class="actor" x="440" y="33">Registry</text><line class="life" x1="700" y1="44" x2="700" y2="480"/><rect class="box" x="632" y="12" width="136" height="32" rx="6"/><text class="actor" x="700" y="33">GitHub Releases</text><line class="req" x1="72" y1="92" x2="437" y2="92" marker-end="url(#rf-a-req)"/><text class="lbl" x="82" y="84">GET /.well-known/carina.json</text><line class="res" x1="438" y1="142" x2="73" y2="142" marker-end="url(#rf-a-res)"/><text class="lbl" x="82" y="134">{"providers.v1": "/v1/providers/"}</text><line class="req" x1="72" y1="192" x2="437" y2="192" marker-end="url(#rf-a-req)"/><text class="lbl" x="82" y="184">GET /v1/providers/carina-rs/aws/versions</text><line class="res" x1="438" y1="242" x2="73" y2="242" marker-end="url(#rf-a-res)"/><text class="lbl" x="82" y="234">{"versions": [...]}</text><line class="req" x1="72" y1="292" x2="437" y2="292" marker-end="url(#rf-a-req)"/><text class="lbl" x="82" y="284">GET /v1/providers/carina-rs/aws/0.7.4/download</text><line class="res" x1="438" y1="342" x2="73" y2="342" marker-end="url(#rf-a-res)"/><text class="lbl" x="82" y="334">{"download_url": "...", ...}</text><line class="req" x1="72" y1="392" x2="697" y2="392" marker-end="url(#rf-a-req)"/><text class="lbl" x="82" y="384">GET {download_url}</text><line class="res" x1="698" y1="442" x2="73" y2="442" marker-end="url(#rf-a-res)"/><text class="lbl" x="82" y="434">WASM binary</text></svg>
