[workspace]
members = [
    "carina-cli",
    "carina-core",
    "carina-lsp",
    "carina-plugin-host",
    "carina-plugin-sdk",
    "carina-provider-mock",
    "carina-provider-mock-http",
    "carina-provider-resolver",
    "carina-provider-protocol",
    "carina-sigstore-tlog",
    "carina-state",
    "carina-tui",
]
resolver = "2"

[workspace.package]
version = "0.7.1"
repository = "https://github.com/carina-rs/carina"
homepage = "https://github.com/carina-rs/carina"
publish = false

# The CI Test job's nextest test-run phase is link-heavy across the
# workspace's many test binaries. Default `debug = 2` emits full DWARF;
# `line-tables-only` keeps file + line numbers in panics and backtraces
# (test failures stay locatable) while dropping variable/type debuginfo,
# producing lighter binaries that link and start faster. Measured on CI:
# nextest test-run phase ~125s -> ~82-98s. The compile phase re-warms to
# steady state once this is on the default branch (rust-cache only saves
# there). No dependency or runtime/program-behavior change; interactive
# debuggers (lldb/rust-gdb) lose variable/type inspection on debug builds
# while panics and backtraces keep file+line. Reversible (a 1-commit
# revert, which itself triggers one more re-warm). Refs #3104/#3089.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# The CI Test job spends ~80% of its nextest time in mock-provider WASM
# compilation with unoptimized wasmtime/Cranelift and secret e2e tests with
# unoptimized Argon2. Optimize only these hot dependency crates: measured
# carina-plugin-host's 328 tests at 169s -> 54s and the CLI secret e2e tests
# at 18.3s -> 3.2s. This changes no test or program behavior; [profile.test]
# inherits these package overrides from [profile.dev], and release is unaffected.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.cranelift-bforest]
opt-level = 3

[profile.dev.package.cranelift-bitset]
opt-level = 3

[profile.dev.package.cranelift-control]
opt-level = 3

[profile.dev.package.cranelift-assembler-x64]
opt-level = 3

[profile.dev.package.cranelift-native]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

[profile.dev.package.wasmtime]
opt-level = 3

[profile.dev.package.wasmtime-environ]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.wasmtime-internal-core]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
