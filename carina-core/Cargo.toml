[package]
name = "carina-core"
version.workspace = true
publish.workspace = true
edition = "2024"
license = "MIT"
description = "Core library for Carina, a functional infrastructure management tool"
repository.workspace = true
homepage.workspace = true

[features]
test-shutdown = []
test-support = []
test-utils = ["dep:tempfile", "test-support"]

[dependencies]
carina-provider-protocol = { path = "../carina-provider-protocol" }
futures = "0.3"
pest = "2"
pest_derive = "2"
regex = "1" # Full regex is required: awscc CFN patterns use \p{...} Unicode classes that regex-lite cannot compile (awscc#295).
regex-syntax = "0.8.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
argon2 = "0.5"
hex = "0.4"
password-hash = { version = "0.5", features = ["getrandom"] }
subtle = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
chrono = "0.4"
dirs = "6"
tempfile = { version = "3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "test-util"] }
tempfile = "3"
