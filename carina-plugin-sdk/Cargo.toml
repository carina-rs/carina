[package]
name = "carina-plugin-sdk"
version = "0.14.1"
edition = "2024"
publish.workspace = true
license = "MIT"

[lints]
workspace = true

[features]
aws = [
    "dep:aws-credential-types", "dep:aws-smithy-runtime-api", "dep:aws-smithy-types", "dep:aws-types",
    "dep:carina-plugin-bindings-aws", "dep:carina-plugin-bindings-aws-credentials",
]
test-utils = ["aws", "dep:wasi"]

[dependencies]
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"], optional = true }
aws-smithy-types = { version = "1", optional = true }
aws-types = { version = "1", optional = true }
carina-core = { path = "../carina-core" }
carina-provider-protocol = { path = "../carina-provider-protocol" }
http = "1"
aws-credential-types = { version = "1", optional = true }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasi = { version = "0.14", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
carina-plugin-bindings-diagnostics = { path = "../carina-plugin-bindings-diagnostics" }
carina-plugin-bindings-aws = { path = "../carina-plugin-bindings-aws", optional = true }
carina-plugin-bindings-aws-credentials = { path = "../carina-plugin-bindings-aws-credentials", optional = true }
carina-plugin-bindings-http = { path = "../carina-plugin-bindings-http" }
carina-plugin-bindings-provider = { path = "../carina-plugin-bindings-provider" }
wasi = "0.14"

[dev-dependencies]
aws-sigv4 = "1"
carina-core = { path = "../carina-core", features = ["test-utils", "provider-host"] }
tokio = { version = "1", features = ["macros", "rt"] }
wasi = "0.14"
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x", "test-util"] }
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
aws-types = "1"
