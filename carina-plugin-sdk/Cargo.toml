[package]
name = "carina-plugin-sdk"
version = "0.9.0"
edition = "2024"
publish.workspace = true
license = "MIT"

[features]
test-utils = [
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-types",
    "dep:http",
    "dep:wasi",
]

[dependencies]
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"], optional = true }
aws-smithy-types = { version = "1", optional = true }
carina-core = { path = "../carina-core" }
carina-provider-protocol = { path = "../carina-provider-protocol" }
http = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasi = { version = "0.14", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
carina-plugin-bindings-aws = { path = "../carina-plugin-bindings-aws" }
carina-plugin-bindings-aws-credentials = { path = "../carina-plugin-bindings-aws-credentials" }
carina-plugin-bindings-http = { path = "../carina-plugin-bindings-http" }
carina-plugin-bindings-provider = { path = "../carina-plugin-bindings-provider" }
wasi = "0.14"
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
aws-smithy-types = "1"
http = "1"

[dev-dependencies]
wasi = "0.14"
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
aws-smithy-types = "1"
http = "1"
