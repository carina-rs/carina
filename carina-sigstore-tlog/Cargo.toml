[package]
name = "carina-sigstore-tlog"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Rekor transparency-log verification for Sigstore bundles"
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
base64 = "0.22"
p256 = "0.13"
serde_json = "1"
sha2 = "0.10"
sigstore = { version = "0.14", default-features = false, features = ["verify"] }
sigstore_protobuf_specs = "0.5.1"
